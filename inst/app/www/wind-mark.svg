<!-- breezeml wind-and-leaf mark.

     Three strokes of moving air, the top and bottom ones curling back on
     themselves, with a single leaf lifted clear at the upper right. The
     outlines and the colours are traced from the breezeml reference
     design, so this is that artwork rather than an approximation of it:
     each shape is the design's own silhouette, smoothed and reduced to
     cubic curves.

     Decorative. It is referenced with alt="" and aria-hidden, since the
     breezeml wordmark beside it already names the application.

     viewBox is 220 x 170; the drawing fills it with a small margin.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 170"
     role="presentation" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="breezeml-wind-1" gradientUnits="userSpaceOnUse"
                    x1="133.9" y1="27.3" x2="56.4" y2="67.8">
      <stop offset="0" stop-color="#7c9381"/>
      <stop offset="1" stop-color="#87a3a6"/>
    </linearGradient>
    <linearGradient id="breezeml-wind-2" gradientUnits="userSpaceOnUse"
                    x1="51.1" y1="94.2" x2="155" y2="105.5">
      <stop offset="0" stop-color="#80a2af"/>
      <stop offset="1" stop-color="#8bacb9"/>
    </linearGradient>
    <linearGradient id="breezeml-wind-3" gradientUnits="userSpaceOnUse"
                    x1="69.8" y1="115.2" x2="123.1" y2="148.3">
      <stop offset="0" stop-color="#80a2ae"/>
      <stop offset="1" stop-color="#789daa"/>
    </linearGradient>
    <linearGradient id="breezeml-leaf" gradientUnits="userSpaceOnUse"
                    x1="199.7" y1="48.1" x2="162.7" y2="76.3">
      <stop offset="0" stop-color="#88a366"/>
      <stop offset="1" stop-color="#75945e"/>
    </linearGradient>
  </defs>

